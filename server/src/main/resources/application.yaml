server:
  port: 8081
spring:
  application:
    name: axle-server
  config:
    # 读取项目根目录的 .env（本地密钥，指向主工作区的同一份，已在 .gitignore 中忽略）
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval=true：dev 用户是 caching_sha2_password，冷缓存下需向服务端索取 RSA 公钥
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: dev
    password: ${MYSQL_PASSWORD:}
  redis:
    host: 127.0.0.1
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.axle.entity # 别名扫描包
logging:
  level:
    com.axle: debug
